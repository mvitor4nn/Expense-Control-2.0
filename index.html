<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap"></noscript>
<style>
/* ===== Design tokens (dark-first, estilo streaming) ===== */
:root{
  --bg:#07070B; --surface:#13131C; --surface2:#1C1C28; --ink:#F4F4F9; --muted:#9696AD; --line:rgba(255,255,255,.08);
  --accent:#A07BFB; --accent-ink:#0B0B12; --grad:linear-gradient(135deg,#7C3AED 0%,#C026D3 58%,#DB2777 100%);
  --ok:#34D399; --warn:#FBBF24; --bad:#FB7185;
  --shadow:0 14px 34px rgba(0,0,0,.5);
  --font-display:"Sora","Trebuchet MS",system-ui,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F4F3F9; --surface:#FFFFFF; --surface2:#EFEDF7; --ink:#15112A; --muted:#6B6686; --line:rgba(21,17,42,.09);
  --accent:#6D28D9; --accent-ink:#FFFFFF; --ok:#047857; --warn:#9A4509; --bad:#BE123C;
  --shadow:0 12px 30px rgba(60,20,120,.13); color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(90% 46% at 50% -8%,color-mix(in srgb,var(--accent) 26%,transparent),transparent 70%),var(--bg);
  background-attachment:fixed;color:var(--ink);font:15px/1.4 var(--font-body);-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.sv{transition:filter .2s ease}
html.priv .sv{filter:blur(9px);user-select:none}

/* topo */
.top{display:flex;align-items:center;gap:12px;padding:12px 0 8px}
.logo{width:44px;height:44px;flex:0 0 44px;border-radius:15px;background:var(--grad);color:#fff;border:0;padding:0;overflow:hidden;display:grid;place-items:center;
  font-family:var(--font-display);font-weight:800;font-size:24px;box-shadow:0 8px 20px rgba(192,38,211,.35)}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.brand-txt{flex:1;min-width:0}
.hello{font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wordmark{font-family:var(--font-display);font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.15}
.iconbtn{position:relative;flex:0 0 42px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.badge{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px}

/* páginas */
.pager{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.pager::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;padding:4px 0 44px;scrollbar-width:none}
.page::-webkit-scrollbar{display:none}
.pager.dragging{user-select:none;cursor:grabbing}
h2.sec{font-family:var(--font-display);font-weight:800;font-size:18px;margin:24px 0 12px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 12px}
.sechead h2.sec{margin:0}
.link{border:0;background:none;color:var(--accent);font-weight:700;font-size:13.5px;padding:4px 0}

/* navegação de mês */
.mnav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 14px}
.mn-b{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.mn-b svg{width:18px;height:18px}
.mn-b:disabled{opacity:.28;cursor:default}
.mn-t{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.01em}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 18px 16px;border:1px solid var(--line);box-shadow:var(--shadow);
  background:linear-gradient(150deg,color-mix(in srgb,var(--accent) 36%,var(--surface)) 0%,var(--surface) 64%)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,#EC4899 38%,transparent),transparent 70%);pointer-events:none}
.hero-main{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.hero-val{font-family:var(--font-display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.03em;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700;background:color-mix(in srgb,var(--ink) 10%,transparent);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.gauge{width:108px;height:108px;flex:0 0 108px;overflow:visible;align-self:flex-start;margin-top:2px}
.hero-main>div:first-child{min-width:0}
.g-bg{fill:none;stroke:color-mix(in srgb,var(--ink) 11%,transparent);stroke-width:11}
.g-fg{fill:none;stroke:var(--accent);stroke-width:11;stroke-linecap:round;transition:stroke-dasharray .7s ease}
.g-fg.warn{stroke:var(--warn)} .g-fg.bad{stroke:var(--bad)}
.g-tick{stroke:var(--ink);stroke-width:2;opacity:.55;stroke-linecap:round}
.g-p{fill:var(--ink);font:800 25px var(--font-display);text-anchor:middle}
.g-s{fill:var(--muted);font:600 12px var(--font-body);text-anchor:middle}
.hero-foot{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.bal{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent);
  border-radius:16px;padding:10px 12px;backdrop-filter:blur(10px)}
.bal small{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.bal b{font-family:var(--font-display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;color:var(--ok)}
.status-note{position:relative;z-index:1;font-size:13px;color:var(--muted);margin:12px 2px 0}
.status-note.bad{color:var(--bad);font-weight:700}

/* indicadores */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 12px 11px;min-width:0}
.kpi small{display:block;font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);line-height:1.2;overflow-wrap:anywhere}
.kpi b{display:block;font-family:var(--font-display);font-weight:800;font-size:15px;margin:4px 0 1px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi span{font-size:12px;font-weight:600;color:var(--muted)}
.kpi.bad b{color:var(--bad)} .kpi.ok b{color:var(--ok)}

/* investimento */
.invcard{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.inv-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.inv-top small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.inv-top b{font-family:var(--font-display);font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.track{position:relative;height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.fill{display:block;height:100%;border-radius:99px;background:var(--grad);transition:width .6s ease}
.fill.ok{background:linear-gradient(90deg,#10B981,#34D399)}

/* botões e campos */
.btn{border:0;border-radius:14px;padding:12px 16px;font-weight:700;background:var(--grad);color:#fff}
.btn.sm{padding:9px 14px;font-size:13.5px;border-radius:12px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:var(--bad)}
.btn[disabled]{opacity:.5}
::placeholder{color:var(--muted);opacity:1}
.hq{display:flex;align-items:center;gap:8px;min-width:0}
.hq h3,.hq label{margin:0}
.qm{flex:0 0 auto;width:18px;height:18px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--muted);font:700 11px/1 var(--font-display);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.qm::after{content:"";position:absolute;inset:-13px}
.qm[aria-expanded="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qm:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qtip{margin:6px 0 4px;padding:8px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:12.5px;line-height:1.4;font-family:var(--font-body,inherit);font-weight:500}
/* Planejar: seções recolhíveis e atalhos */
.plchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.plchips::-webkit-scrollbar{display:none}
.plchips .chip{white-space:nowrap;flex:0 0 auto;font-size:13px}
.plg{margin-top:10px}
.plg>summary{list-style:none;display:flex;align-items:center;gap:10px;min-height:48px;padding:6px 4px;cursor:pointer;font-family:var(--font-display);font-weight:800;font-size:15px;color:var(--ink);-webkit-tap-highlight-color:transparent}
.plg>summary::-webkit-details-marker{display:none}
.plg>summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.plg .pl-ch{margin-left:auto;width:18px;height:18px;color:var(--muted);transition:transform .2s}
.plg[open]>summary .pl-ch{transform:rotate(180deg)}
.set-row[hidden],.set-h[hidden],.set-list[hidden]{display:none!important}
.set-q{margin:2px 0 6px}
.rowline b{font-variant-numeric:tabular-nums}

.set-row{text-decoration:none;color:var(--ink)}
.legal-links{text-align:center}.legal-links a{color:var(--accent);font-weight:600}
.zone{margin-top:20px;padding-top:14px;border-top:1px solid color-mix(in srgb,var(--bad) 45%,var(--line))}
.zone h4{margin:0 0 4px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--bad)}
.sconf{position:absolute;inset:0;z-index:70;display:flex;align-items:flex-end}
.sconf .g-msg.err{color:var(--bad);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin:0 0 12px}
.card h3{margin:0 0 2px;font-family:var(--font-display);font-weight:800;font-size:15.5px}
.big{font-family:var(--font-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:700;color:var(--muted)}
.input{width:100%;min-width:0;border:1.5px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px 14px;font-size:16px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.input[aria-invalid="true"]{border-color:var(--bad);box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 22%,transparent)}
select.input{text-overflow:ellipsis}
.money{display:flex;align-items:center;gap:8px}
.money span{font-family:var(--font-display);font-weight:800;font-size:22px;color:var(--accent)}
.money .input{font-size:22px;font-weight:700;font-family:var(--font-display)}
.money.xl{justify-content:center;margin:2px 0}
.money.xl span{font-size:28px}
.money.xl .input{font-size:36px;text-align:center;border:0;background:none;padding:6px 0;max-width:240px;box-shadow:none}
input[type=range]{width:100%;accent-color:var(--accent);margin:10px 0 2px;height:28px}
.rowline{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin:14px 2px 0}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin:4px 0 14px}
.segc button{border:0;background:none;border-radius:10px;padding:9px 0;font-weight:700;font-size:14px;color:var(--muted)}
.segc button[aria-pressed="true"]{background:var(--grad);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:13.5px;color:var(--muted)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,var(--surface2));color:var(--ink)}

/* donut + categorias */
.donut-wrap{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.donut{width:min(176px,46vw);height:auto;flex:0 0 auto;overflow:visible}
.dseg{cursor:pointer;transition:stroke-width .15s ease}
.dseg:hover,.dseg:focus-visible{stroke-width:31}
.dt-l{fill:var(--muted);font:600 12px var(--font-body)}
.dt-v{fill:var(--ink);font:800 17px var(--font-display)}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.lg{display:flex;align-items:center;gap:8px;font-size:12.5px;min-width:0}
.lg i{flex:0 0 9px;width:9px;height:9px;border-radius:50%}
.lg span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lg b{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.clist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:2px 14px}
.crow{--c:var(--accent);display:block;width:100%;text-align:left;border:0;background:none;color:inherit;padding:13px 0 14px;border-bottom:1px solid var(--line);border-radius:0}
.crow:last-child{border-bottom:0}
.crow:active{opacity:.7}
.c-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:9px}
.c-name{display:flex;align-items:center;gap:9px;min-width:0;font-weight:700;font-size:14.5px;overflow-wrap:anywhere}
.c-dot{flex:0 0 10px;width:10px;height:10px;border-radius:50%;background:var(--c)}
.c-val{flex:0 0 auto;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.c-val small{font-weight:500;font-size:12px;color:var(--muted);margin-left:6px}
.c-track{display:block;height:6px;border-radius:99px;background:var(--surface2);overflow:hidden}
.c-fill{display:block;height:100%;border-radius:99px;background:var(--c);min-width:4px;transition:width .5s ease}
.crow.month .c-name{font-family:var(--font-display);font-weight:800;font-size:15.5px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--surface2);padding:7px 13px 7px 8px;border-radius:999px;font-weight:700;font-size:13.5px}
.cat-title{display:flex;align-items:center;gap:10px;--c:var(--accent)}
.cat-title h2.sec{margin:0}
.hint{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:12.5px;margin:26px 0 0}
.empty{color:var(--muted);text-align:center;padding:34px 14px;border:2px dashed var(--line);border-radius:22px;font-size:14px}

/* lançamentos */
.txl{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.tx{--c:var(--accent);display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:0;background:none;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx:active{background:var(--surface2)}
.tx-ic{flex:0 0 40px;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-family:var(--font-display);background:color-mix(in srgb,var(--c) 22%,transparent);color:color-mix(in srgb,var(--c) 40%,var(--ink))}
.tx-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tx-name{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-meta{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-price{flex:0 0 auto;font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-price.inv{color:var(--ok)}
.dayh{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--muted);margin:18px 4px 8px;text-transform:capitalize}
.searchrow{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.search{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:0 14px}
.search:focus-within{border-color:var(--accent)}
.search svg{width:18px;height:18px;color:var(--muted);flex:0 0 18px}
.search input{flex:1;min-width:0;border:0;background:none;padding:12px 0;font-size:16px;outline:none}

/* gráficos */
.chart-card{padding:16px 14px 12px}
.chart-card h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.lgd{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.lgd i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:12px;font-weight:700;font-family:var(--font-body)}
.chart .l-now{fill:none;stroke:var(--accent);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.chart .l-prev{fill:none;stroke:var(--muted);opacity:.5;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.chart .l-goal{fill:none;stroke:var(--warn);stroke-width:1.8;stroke-dasharray:5 5;opacity:.9}
.chart .d-now{fill:var(--accent)} .chart .d-prev{fill:var(--muted);opacity:.7}
.chart .hit{fill:transparent;cursor:pointer}
.chart-cap{min-height:20px;font-size:13px;color:var(--muted);text-align:center;margin-top:4px;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* gráficos: visual premium */
.chart-card{padding:18px 16px 12px;position:relative;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 17%,var(--surface)) 0%,var(--surface) 62%);box-shadow:var(--shadow)}
.ch-top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 0 8px}
.ch-top small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ch-top b{display:block;font-family:var(--font-display);font-weight:800;font-size:30px;line-height:1.1;letter-spacing:-.03em;margin-top:3px;font-variant-numeric:tabular-nums}
.ch-delta span{display:inline-flex;align-items:center;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--muted)}
.ch-delta span.up{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.ch-delta span.down{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chart{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 6}
.chart .ax.cur{fill:var(--ink)}
.chart .bv{fill:var(--ink);font:800 12px var(--font-display)}
.chart .a-now{fill:url(#chA);stroke:none}
.chart .l-now{stroke:url(#chL);stroke-width:3.5;filter:drop-shadow(0 6px 10px color-mix(in srgb,var(--accent) 55%,transparent))}
.chart .l-prev{stroke:var(--muted);opacity:.55;stroke-width:2;stroke-dasharray:3 6}
.chart .d-now{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .d-last{fill:var(--accent);stroke:var(--surface);stroke-width:3}
.chart .halo{fill:var(--accent);opacity:.22;transform-box:fill-box;transform-origin:center;animation:chPulse 2.4s ease-out infinite}
.chart .bar{fill:url(#chB);opacity:.45;transform-box:fill-box;transform-origin:50% 100%;transition:opacity .2s}
.chart .bar.cur,.chart .bar.on{opacity:1}
.chart .bar.zero{fill:var(--surface2);opacity:1}
.chart .ch-sel{opacity:0;transition:opacity .15s;pointer-events:none}
.chart .ch-sel.on{opacity:1}
.chart .cs-l{stroke:var(--ink);opacity:.35;stroke-width:1.5;stroke-dasharray:3 4}
.chart .cs-d{fill:var(--ink);stroke:var(--accent);stroke-width:3}
.chart .cs-t rect{fill:var(--ink)}
.chart .cs-t text{fill:var(--bg);font:800 12.5px var(--font-body)}
.chart.anim .l-now{stroke-dasharray:1;animation:chDraw .9s cubic-bezier(.3,.7,.2,1) both}
.chart.anim .a-now{animation:chFade 1s .25s ease both}
.chart.anim .bar{animation:chRise .7s cubic-bezier(.3,.8,.2,1) both}
@keyframes chDraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes chFade{from{opacity:0}to{opacity:1}}
@keyframes chRise{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes chPulse{0%{transform:scale(.6);opacity:.4}100%{transform:scale(1.5);opacity:0}}
.chart-cap{min-height:20px;font-size:12.5px;font-weight:600}
.stat{background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface));border-radius:18px}

.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat small{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.05em;text-transform:uppercase}

.stat span{font-size:12.5px;font-weight:700;color:var(--muted)}
.stat span.up{color:var(--bad)} .stat span.down{color:var(--ok)}

/* medidor das definições */
.meter{position:relative;margin:12px 0 4px}
.meter.labeled{padding:22px 0 24px}
.meter.labeled .m-label.top{padding-right:5px}.meter.labeled .m-label.bot{padding-left:5px}
.mtrack{position:relative;height:10px;border-radius:99px;background:var(--surface2)}
.mtrack .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
.mtrack .fill.warn{background:var(--warn)} .mtrack .fill.bad{background:var(--bad)}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);opacity:.55;border-radius:2px}
.m-label{position:absolute;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;line-height:1.2}
.m-label.top{top:0}.m-label.bot{bottom:0}

/* barra inferior */
.tabs{position:relative;z-index:6;display:grid;grid-template-columns:1fr 1fr 72px 1fr 1fr;align-items:center;margin:6px 0 max(10px,env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:26px;padding:8px 6px;box-shadow:var(--shadow)}
.tab{border:0;background:none;border-radius:16px;padding:6px 2px 5px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}

.fab{width:58px;height:58px;border-radius:50%;margin:-30px auto 0;border:4px solid var(--bg);background:var(--grad);color:#fff;display:grid;place-items:center;box-shadow:0 10px 26px rgba(192,38,211,.5)}

.fab:active{transform:scale(.95)}

/* aviso */
.toast{position:absolute;left:0;right:0;top:calc(6px + env(safe-area-inset-top,0px));z-index:60;display:flex;gap:12px;align-items:flex-start;background:var(--surface);
  border:1px solid var(--line);border-radius:18px;padding:13px 12px;box-shadow:var(--shadow);transform:translateY(-160%);opacity:0;transition:transform .35s ease,opacity .35s ease;pointer-events:none}
.toast.show{transform:none;opacity:1;pointer-events:auto}
.toast .ico{flex:0 0 32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--accent)}
.toast.warn .ico{background:var(--warn)} .toast.bad .ico{background:var(--bad)} .toast.info .ico{background:var(--ok)}
.toast b{display:block;font-size:14.5px}
.toast p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.toast p:empty{display:none}
.toast .x{border:0;background:none;font-size:20px;line-height:1;color:var(--muted);padding:0 4px}
.toast>div{min-width:0;flex:1}
.toast .tact{flex:0 0 auto;border:0;background:color-mix(in srgb,var(--accent) 22%,transparent);color:var(--accent);font-weight:800;border-radius:10px;padding:8px 12px;font-size:13.5px}

/* folhas */
.sheet{position:absolute;inset:0;z-index:20;display:flex;align-items:flex-end}
.scrim,.d-scrim{position:absolute;inset:0;background:rgba(0,0,0,.6);animation:fade .2s ease;backdrop-filter:blur(3px)}
.panel{position:relative;width:100%;max-height:90%;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));
  box-shadow:0 -12px 40px rgba(0,0,0,.4);animation:rise .28s cubic-bezier(.2,.8,.2,1);border:1px solid var(--line);border-bottom:0}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 14px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sh-dot{width:14px;height:14px;border-radius:50%;background:var(--c,var(--accent));flex:0 0 14px}
.sh-title{font-family:var(--font-display);font-weight:800;font-size:21px;margin:0;line-height:1.15}
.sh-close{margin-left:auto;border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;font-size:18px;line-height:1;flex:0 0 34px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.formgrid .full{grid-column:1/-1}
.flist{margin-top:8px}
.fcat{border-top:1px solid var(--line)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
.fchk{display:flex;align-items:center;gap:10px;padding:9px 0;flex:1;min-width:0;cursor:pointer}
.fchk input{width:20px;height:20px;accent-color:var(--accent);flex:0 0 20px;margin:0}
.fchk b{font-weight:700}
.fchk.sub{padding-left:30px}
.fchk .sh-dot{flex:0 0 12px;width:12px;height:12px}
.fexp{border:0;background:var(--surface2);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:0 0 34px}
.fexp svg{width:16px;height:16px;transition:transform .15s ease}
.fexp[aria-expanded="true"] svg{transform:rotate(180deg)}
.fsubs{padding-bottom:6px}

/* menu lateral */
.drawer{position:absolute;inset:0;z-index:40;display:flex}
.d-panel{position:relative;width:min(90%,380px);height:100%;background:var(--bg);border-right:1px solid var(--line);box-shadow:12px 0 40px rgba(0,0,0,.4);display:flex;flex-direction:column;animation:slidein .25s ease;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.d-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}

.d-body::-webkit-scrollbar{display:none}
.d-list{display:flex;flex-direction:column;gap:12px}
.d-item{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--surface);padding:16px;border-radius:18px;text-align:left;font-family:var(--font-display);font-weight:800;font-size:17px}
.d-item .ic{width:24px;height:24px;color:var(--accent);flex:0 0 24px}
.d-item .go,.set-row .go{margin-left:auto;width:18px;height:18px;color:var(--muted);flex:0 0 18px}
.d-vhead{margin:4px 0 0}
.lang-opt{display:flex;align-items:center;justify-content:space-between;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;font-weight:700;font-size:16px;margin-top:10px}
.lang-opt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--surface))}
.lang-opt .tick-ok{color:var(--accent);font-weight:800}
.av-row{display:flex;align-items:center;gap:14px;margin-top:12px}
.av-prev{width:64px;height:64px;font-size:34px;border-radius:20px;flex:0 0 64px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid #dadce0;background:#fff;color:#1f1f1f;border-radius:999px;padding:12px 16px;font-weight:700;margin-top:12px}
.gbtn svg{width:20px;height:20px;flex:0 0 20px}
.gbtn:disabled{opacity:.6}
.g-as{margin:12px 0 0;font-size:14px;word-break:break-all}
.g-msg{margin:10px 0 0;font-size:13px;color:var(--muted)}
.g-out{color:var(--bad);font-weight:700;font-size:14px;padding:8px 0}
.set-h{margin:20px 4px 8px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.set-list{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:6px}

.set-row+.set-row{border-top:1px solid var(--line)}
.set-row:active{background:var(--surface2)}
.set-row .ic{width:24px;height:24px;color:var(--accent);flex:0 0 24px}
.set-t{display:flex;flex-direction:column;min-width:0}
.set-t small{font-family:var(--font-body);font-weight:500;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.theme-prev{height:120px;border-radius:14px;margin-top:12px;border:1.5px dashed var(--line);background:var(--surface2) center/cover no-repeat;display:grid;place-items:center;text-align:center;padding:10px;font-size:13px;color:var(--muted)}
.theme-prev.on{border-style:solid}


/* ===== menu v3: perfil, atalhos e configurações ===== */
.ico{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 4px 10px color-mix(in srgb,var(--c) 32%,transparent)}
.ico svg{width:19px;height:19px}
.c-blue{--c:#3B82F6}.c-green{--c:#10B981}.c-pink{--c:#EC4899}.c-violet{--c:#8B5CF6}.c-cyan{--c:#06B6D4}.c-amber{--c:#F59E0B}.c-orange{--c:#F97316}.c-slate{--c:#64748B}.c-red{--c:#EF4444}
.d-who .hello{font-size:12.5px}
.phero{display:flex;align-items:center;gap:14px;padding:16px;border-radius:24px;border:1px solid var(--line);
  background:radial-gradient(120% 150% at 0% 0%,color-mix(in srgb,var(--accent) 30%,transparent),transparent 62%),var(--surface)}
.hero-av{width:64px;height:64px;flex:0 0 64px;border-radius:20px;font-size:34px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px color-mix(in srgb,var(--accent) 65%,transparent),0 10px 24px rgba(192,38,211,.35)}
.hero-t{flex:1;min-width:0}
.hero-name{font-family:var(--font-display);font-weight:800;font-size:18px;line-height:1.2;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-sub{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:12.5px;color:var(--muted);min-width:0}
.hero-sub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:0 0 8px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.hero-edit{flex:0 0 40px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--surface2) 80%,transparent);display:grid;place-items:center}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:0;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--surface);text-align:left;transition:transform .12s ease,background .12s ease}
.tile:active{transform:scale(.97);background:var(--surface2)}
.tile .ico{margin-bottom:8px}
.tile-t{font-family:var(--font-display);font-weight:700;font-size:15px}
.tile small{max-width:100%;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.set-row:active{background:var(--surface2)}
.set-row .go{margin-left:auto}
.set-row.danger .set-t>span:first-child{color:var(--bad)}
.set-row.danger.armed{background:color-mix(in srgb,var(--bad) 18%,var(--surface))}

.set-row.fact:active{background:none}
.set-t small.wrap{white-space:normal;line-height:1.4;margin-top:2px}
.set-list{margin-bottom:0}
.d-list .set-h{margin-top:6px}
#dv-settings .set-h{margin-top:22px}
.foot{margin:18px 0 0;text-align:center;font-size:12px;color:var(--muted)}
.prof{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:22px 16px}
.prof-av{width:96px;height:96px;flex:0 0 96px;font-size:50px;border-radius:30px}
.prof-btns{justify-content:center;width:100%}
.prof .sub{margin:0}
.about{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 16px}
.about-logo{width:72px;height:72px;font-size:38px;border-radius:22px;margin-bottom:6px}
.facts{margin-top:12px}
.d-body>*{animation:dfade .22s ease}
@keyframes dfade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* tema com foto */
.bg-img,.bg-dim{position:fixed;inset:0;z-index:-1;display:none;pointer-events:none}

.bg-dim{background:#000;opacity:.45}
html.has-bg .bg-img,html.has-bg .bg-dim{display:block}
html.has-bg{--bg:rgba(18,12,32,.7);--surface:rgba(20,14,36,.78);--surface2:rgba(255,255,255,.14);--ink:#fff;--muted:rgba(255,255,255,.88);--line:rgba(255,255,255,.2);--accent:#D6C8FF;--accent-ink:#0B0B12;--warn:#FFC766;--bad:#FF8FA3;--ok:#7FDDA5;color-scheme:dark}
html.has-bg body{background:transparent}
html.has-bg .card,html.has-bg .tabs,html.has-bg .kpi,html.has-bg .clist,html.has-bg .txl,html.has-bg .invcard,html.has-bg .stat,html.has-bg .iconbtn,html.has-bg .mn-b,html.has-bg .search,html.has-bg .segc{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
html.has-bg .panel,html.has-bg .toast,html.has-bg .d-panel{background:rgba(20,14,36,.96)}
html.has-bg .tabs{background:rgba(20,14,36,.9)}
html.has-bg .chip{background:rgba(20,14,36,.78)}
html.has-bg .top,html.has-bg h2.sec,html.has-bg .sub,html.has-bg .hint,html.has-bg .note,html.has-bg .mn-t,html.has-bg .dayh{text-shadow:0 1px 10px rgba(0,0,0,.65)}

.c-fill.warn{background:var(--warn)}
.c-fill.bad{background:var(--bad)}
/* skeleton */
.sk{background:linear-gradient(90deg,var(--surface2) 25%,var(--line) 37%,var(--surface2) 63%);background-size:400% 100%;animation:shimmer 1.4s ease infinite;border-radius:14px}

/* bloqueio e onboarding */
.gate{position:absolute;inset:0;z-index:90;background:#0B0B12;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top,0px)) 4px calc(24px + env(safe-area-inset-bottom,0px))}
:root[data-theme="light"] .gate{background:#F4F3F9}
.gate-in{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;overflow-y:auto}
.gate h1{font-family:var(--font-display);font-weight:800;font-size:26px;line-height:1.15;margin:0 0 8px;letter-spacing:-.02em}
.dots{display:flex;gap:14px;justify-content:center;margin:22px 0 6px;min-height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--muted)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots.err i{border-color:var(--bad);background:var(--bad)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:300px;width:100%;margin:18px auto 0}
.pad button{height:64px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font:800 24px var(--font-display);display:grid;place-items:center}

.gmsg{min-height:20px;text-align:center;font-size:13.5px;color:var(--bad);font-weight:600;margin:6px 0 0}
.steps{display:flex;gap:6px;margin-bottom:26px}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--surface2)}
.steps i.on{background:var(--grad)}
.onb-foot{display:flex;gap:10px;align-items:center;margin-top:18px}
.onb-foot .btn{flex:1}
@keyframes shimmer{0%{background-position:100% 50%}100%{background-position:0 50%}}
@keyframes rise{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slidein{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:560px){.app{height:calc(100% - 24px);margin-top:12px}}

<body>
<noscript><p style="padding:24px;font:16px system-ui;color:#F4F4F9;background:#07070B">Expense Control precisa de JavaScript. / needs JavaScript. / necesita JavaScript.</p></noscript>

<div class="app" id="app">
  <header class="top">
    <button class="logo" id="logoBtn" type="button" aria-label="Menu" data-i18n-aria="menu_aria">$</button>
    <div class="brand-txt"><div class="hello" id="hello"></div><div class="wordmark">Expense Control</div></div>
    <button class="iconbtn" id="privBtn" type="button" aria-label="Ocultar valores" data-i18n-aria="priv_aria" aria-pressed="false"></button>
  </header>

  <div class="toast" id="toast" role="status" aria-live="polite">
    <div class="ico" id="toastIco" aria-hidden="true">!</div>
    <div><b id="toastTitle"></b><p id="toastMsg"></p></div>
    <button class="tact" id="toastAct" type="button" hidden></button>
    <button class="x" id="toastX" aria-label="Fechar aviso" data-i18n-aria="toast_close">×</button>

function seed(){
  var out=[],id=1;
  for(var m=9;m>=0;m--){
    var d=new Date(NOW.getFullYear(),NOW.getMonth()-m,1),y=d.getFullYear(),mo=d.getMonth(),cur=m===0;
    var maxDay=cur?NOW.getDate():new Date(y,mo+1,0).getDate(),r=rng(y*12+mo+7);
    TPL.forEach(function(t){
      var n=cur?t.now:t.n[0]+Math.floor(r()*(t.n[1]-t.n[0]+1));
      for(var i=0;i<n;i++){
        var day=1+Math.floor(r()*maxDay),hh=7+Math.floor(r()*15),mm=Math.floor(r()*12)*5;
        out.push({id:'s'+(id++),cat:t.c,sub:t.s,name:t.items[Math.floor(r()*t.items.length)],
          price:Math.round((t.min+r()*(t.max-t.min))*100)/100,ts:y+'-'+pad(mo+1)+'-'+pad(day)+'T'+pad(hh)+':'+pad(mm)});
      }
    });
  }
  return out;
}

function rollover(){
  var k=S.carryMonth,guard=0,ch=false;
  while(k<CUR&&guard++<600){
    S.carry.sal=Math.max(0,S.carry.sal+S.salary+incMonth(k)-salSpent(k));
    S.carry.va=Math.max(0,S.carry.va+S.va-vaSpent(k));
    k=shiftKey(k,1);ch=true;
  }
  if(ch||S.carryMonth!==k){S.carryMonth=k;Repo.write(S)}
}
function availSal(){return S.carry.sal+S.salary+incMonth(CUR)-salSpent(CUR)}
function incMonth(k){return S.incomes.filter(function(i){return i.ts.slice(0,7)===k}).reduce(function(a,i){return a+i.price},0)}
/* lança sozinho os gastos recorrentes dos meses que ainda não foram gerados */
function genRecurring(){
  var n=0,today=NOW.getDate();
  S.recurring.forEach(function(r){
    var k=shiftKey(r.last||shiftKey(CUR,-1),1),guard=0;
    while(k<=CUR&&guard++<600){
      var d=Math.min(r.day,daysIn(k));
      if(k===CUR&&d>today)break;
      var id='r'+r.id+k.replace('-','');
      if(!S.expenses.some(function(e){return e.id===id})){
        S.expenses.push({id:id,cat:r.cat,sub:r.sub,pay:r.pay,name:r.name,addr:'',price:r.price,ts:k+'-'+pad(d)+'T09:00',rec:r.id});n++;
      }
      r.last=k;k=shiftKey(k,1);
    }
  });
  if(n>0)Repo.write(S);
  return n;
}

var perfMode='week';

var DOW={pt:'DSTQQSS',en:'SMTWTFS',es:'DLMXJVS'};
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dayTotals(){var m={};S.expenses.forEach(function(e){if(isInv(e))return;var k=e.ts.slice(0,10);m[k]=(m[k]||0)+e.price});return m}
function niceStep(max){var raw=Math.max(max,1)/3,k=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/k;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*k}
var chSeen='';
function chAnim(k){var a=chSeen!==k;chSeen=k;return a}
function chR(v){return Math.round(v*10)/10}
function chK(v){return v>=1000?nf(Math.round(v/100)/10,0)+'k':nf(v,0)}
/* curva suave que não "estoura" abaixo da linha de base (interpolação monotônica) */
function smoothPath(p){
  var n=p.length,i;if(n<2)return '';
  var dx=[],m=[],t=[];
  for(i=0;i<n-1;i++){dx[i]=p[i+1][0]-p[i][0];m[i]=(p[i+1][1]-p[i][1])/dx[i]}
  t[0]=m[0];t[n-1]=m[n-2];
  for(i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
  for(i=0;i<n-1;i++){
    if(m[i]===0){t[i]=0;t[i+1]=0}
    else{var a=t[i]/m[i],b=t[i+1]/m[i],q=a*a+b*b;if(q>9){var k=3/Math.sqrt(q);t[i]=k*a*m[i];t[i+1]=k*b*m[i]}}
  }
  var d='M'+chR(p[0][0])+' '+chR(p[0][1]);
  for(i=0;i<n-1;i++){var h=dx[i]/3;d+='C'+chR(p[i][0]+h)+' '+chR(p[i][1]+t[i]*h)+' '+chR(p[i+1][0]-h)+' '+chR(p[i+1][1]-t[i+1]*h)+' '+chR(p[i+1][0])+' '+chR(p[i+1][1])}
  return d;
}
function chDefs(){
  return '<defs><linearGradient id="chL" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" stop-color="#EC4899"/></linearGradient>'+
    '<linearGradient id="chA" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.42"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient>'+
    '<linearGradient id="chB" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#EC4899"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient></defs>';
}
function chSelG(){return '<g class="ch-sel"><line class="cs-l" x1="0" x2="0" y1="26" y2="162"/><circle class="cs-d" cx="0" cy="0" r="6"/><g class="cs-t"><rect rx="13" ry="13" width="10" height="26"/><text x="0" y="0" text-anchor="middle"></text></g></g>'}
function chGrid(st,Y,L0,R0){
  var o='';for(var g=0;g<=3;g++){var v=st*g;o+='<line class="grid" x1="'+L0+'" x2="'+R0+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="ax" x="0" y="'+(Y(v)+4)+'">'+chK(v)+'</text>'}
  return o;
}
function lineChart(labels,series,goal,tips,anim){
  var W=340,H=196,L0=40,R0=322,T0=26,B0=162,n=labels.length,mx=0;
  series.forEach(function(s){s.pts.forEach(function(v){if(v!=null&&v>mx)mx=v})});if(goal>mx)mx=goal;
  var st=niceStep(mx),top=st*3;
  var X=function(i){return chR(n>1?L0+(R0-L0)*i/(n-1):(L0+R0)/2)},Y=function(v){return chR(B0-(B0-T0)*v/top)};
  var o='<svg class="chart'+(anim?' anim':'')+'" viewBox="0 0 '+W+' '+H+'" role="img">'+chDefs()+chGrid(st,Y,L0,R0);
  labels.forEach(function(t,i){o+='<text class="ax" x="'+X(i)+'" y="186" text-anchor="middle">'+esc(t)+'</text>'});
  if(goal>0)o+='<line class="l-goal" x1="'+L0+'" x2="'+R0+'" y1="'+Y(goal)+'" y2="'+Y(goal)+'"/>';
  series.forEach(function(s){
    var pts=[],last=-1;s.pts.forEach(function(v,i){if(v!=null){pts.push([X(i),Y(v)]);last=i}});
    if(!pts.length)return;
    if(pts.length>1){
      var d=smoothPath(pts);
      if(s.k==='now')o+='<path class="a-now" d="'+d+'L'+pts[pts.length-1][0]+' '+B0+'L'+pts[0][0]+' '+B0+'Z"/>';
      o+='<path class="l-'+s.k+'" pathLength="1" d="'+d+'"/>';
    }
    if(s.k==='now'){
      s.pts.forEach(function(v,i){if(v!=null&&i!==last)o+='<circle class="d-now" cx="'+X(i)+'" cy="'+Y(v)+'" r="3.5"/>'});
      o+='<circle class="halo" cx="'+X(last)+'" cy="'+Y(s.pts[last])+'" r="12"/><circle class="d-last" cx="'+X(last)+'" cy="'+Y(s.pts[last])+'" r="6"/>';
    }
  });
  o+=chSelG();
  labels.forEach(function(t,i){
    var vals=series.map(function(s){return s.pts[i]}),yv=null;
    vals.forEach(function(v){if(v!=null)yv=v});
    var w=(R0-L0)/Math.max(n-1,1);
    o+='<rect class="hit" x="'+chR(X(i)-w/2)+'" y="'+T0+'" width="'+chR(w)+'" height="'+(B0-T0+16)+'" data-pt="'+i+'" data-x="'+X(i)+'" data-y="'+(yv==null?B0:Y(yv))+'" data-v="'+vals.map(function(v){return v==null?'':v}).join(',')+'" data-t="'+esc((tips&&tips[i])||t)+'"/>';
  });
  return o+'</svg>';
}
function barChart(labels,vals,goal,tips,anim){
  var W=340,H=196,L0=40,R0=326,T0=26,B0=162,n=labels.length,mx=0;
  vals.forEach(function(v){if(v>mx)mx=v});if(goal>mx)mx=goal;
  var st=niceStep(mx),top=st*3,slot=(R0-L0)/n,bw=Math.min(32,slot*.66);
  var X=function(i){return chR(L0+slot*(i+.5))},Y=function(v){return chR(B0-(B0-T0)*v/top)};
  var o='<svg class="chart'+(anim?' anim':'')+'" viewBox="0 0 '+W+' '+H+'" role="img">'+chDefs()+chGrid(st,Y,L0,R0);
  if(goal>0)o+='<line class="l-goal" x1="'+L0+'" x2="'+R0+'" y1="'+Y(goal)+'" y2="'+Y(goal)+'"/>';
  vals.forEach(function(v,i){
    var cur=i===n-1,h=Math.max(v>0?4:3,B0-Y(v)),y=chR(B0-h);

    o+='<text class="ax'+(cur?' cur':'')+'" x="'+X(i)+'" y="186" text-anchor="middle">'+esc(labels[i])+'</text>';
    if(cur&&v>0)o+='<text class="bv" x="'+X(i)+'" y="'+chR(y-8)+'" text-anchor="middle">'+chK(v)+'</text>';
  });
  o+=chSelG();
  vals.forEach(function(v,i){
    o+='<rect class="hit" x="'+chR(X(i)-slot/2)+'" y="'+T0+'" width="'+chR(slot)+'" height="'+(B0-T0+16)+'" data-pt="'+i+'" data-x="'+X(i)+'" data-y="'+Y(v)+'" data-v="'+v+'" data-t="'+esc((tips&&tips[i])||labels[i])+'"/>';

/* seleção por toque/arraste: linha guia, marcador e tooltip dentro do gráfico */
function chPick(hit){
  if(!hit)return;var svg=hit.ownerSVGElement;if(!svg)return;
  var g=svg.querySelector('.ch-sel');if(!g)return;
  var x=+hit.getAttribute('data-x'),y=+hit.getAttribute('data-y'),vs=hit.getAttribute('data-v').split(',').filter(function(v){return v!==''}),
      tt=hit.getAttribute('data-t'),txt=tt+' · '+brl(+vs[vs.length-1]);
  var l=g.querySelector('.cs-l'),d=g.querySelector('.cs-d'),tg=g.querySelector('.cs-t'),rc=tg.querySelector('rect'),tx=tg.querySelector('text');
  tx.textContent=txt;
  var w;try{w=Math.ceil(tx.getComputedTextLength())+22}catch(e){w=txt.length*7.4+22}
  if(!(w>22))w=txt.length*7.4+22;
  var rx=Math.max(2,Math.min(340-w-2,x-w/2)),ry=Math.max(2,y-40);
  l.setAttribute('x1',x);l.setAttribute('x2',x);d.setAttribute('cx',x);d.setAttribute('cy',y);
  rc.setAttribute('x',rx);rc.setAttribute('y',ry);rc.setAttribute('width',w);
  tx.setAttribute('x',rx+w/2);tx.setAttribute('y',ry+17.5);
  g.classList.add('on');
  var i=hit.getAttribute('data-pt');
  svg.querySelectorAll('.bar').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-i')===i)});
  var cap=document.getElementById('chartCap');
  if(cap)cap.textContent=tt+' · '+vs.map(function(v){return brl(+v)}).join(' / ');
}
(function(){
  var down=null,lastHit=null;
  function near(svg,ev){
    var r=svg.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*340,best=null,bd=1e9;
    svg.querySelectorAll('.hit').forEach(function(h){var d=Math.abs(+h.getAttribute('data-x')-x);if(d<bd){bd=d;best=h}});
    return best;
  }
  document.addEventListener('pointerdown',function(ev){
    var s=ev.target.closest&&ev.target.closest('svg.chart');if(!s)return;
    down=s;lastHit=near(s,ev);chPick(lastHit);
  },true);
  document.addEventListener('pointermove',function(ev){
    if(!down)return;var h=near(down,ev);if(h&&h!==lastHit){lastHit=h;chPick(h)}
  },true);
  ['pointerup','pointercancel'].forEach(function(n){document.addEventListener(n,function(){down=null;lastHit=null},true)});
})();
function pctTag(cur,prev){
  if(!(prev>0))return '';
  var d=Math.round((cur-prev)/prev*100);
  if(d===0)return '<span>'+L('vs_same')+'</span>';
  return '<span class="'+(d>0?'up':'down')+'">'+(d>0?'▲ ':'▼ ')+L('vs_prev',{p:Math.abs(d)})+'</span>';
}
function weekData(){
  var dt=dayTotals(),now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var off=(today.getDay()-WEEK_START+7)%7,start=new Date(today.getFullYear(),today.getMonth(),today.getDate()-off);
  var cur=[],prev=[],labels=[],keys=[];
  for(var i=0;i<7;i++){
    var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i),p=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i-7);
    labels.push(DOW[lang].charAt(d.getDay()));keys.push(dkey(d));
    prev.push(Math.round((dt[dkey(p)]||0)*100)/100);

  }
  return {cur:cur,prev:prev,labels:labels,keys:keys,off:off};
}

/* ---------- notificação do sistema ---------- */
function askNotif(cb){
  try{
    if(!('Notification' in window)){cb&&cb(false);return}
    if(Notification.permission==='default')Notification.requestPermission().then(function(p){cb&&cb(p==='granted')},function(){cb&&cb(false)});
    else cb&&cb(Notification.permission==='granted');
  }catch(e){cb&&cb(false)}
}
function sysNotify(title,body,tag){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    var o={body:body,tag:tag||'expense-alert',icon:'icon-192.png',badge:'icon-192.png',renotify:true};
    if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(function(r){r.showNotification(title,o)},function(){new Notification(title,o)});
    else new Notification(title,o);
  }catch(e){}
}
/* ---------- avisos ---------- */
var toastTimer;
function toast(kind,title,msg){
  $('#toastAct').hidden=true;
  var el=$('#toast');el.className='toast '+kind;$('#toastTitle').textContent=title;$('#toastMsg').textContent=msg||'';
  $('#toastIco').textContent=kind==='info'?'✓':'!';
  requestAnimationFrame(function(){el.classList.add('show')});
  clearTimeout(toastTimer);toastTimer=setTimeout(hideToast,kind==='info'?3200:9000);
}
function hideToast(){$('#toast').classList.remove('show')}
var undoFn=null;
function toastUndo(title,fn){
  toast('info',title,'');undoFn=fn;var a=$('#toastAct');a.textContent=L('undo');a.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){hideToast();undoFn=null},7000);
}
$('#toastAct').addEventListener('click',function(){var f=undoFn;undoFn=null;hideToast();if(f)f()});
function alertCopy(kind,spent,pct){
  if(kind==='bad')return [L('a_bad_t',{p:S.limit}),L('a_bad_m',{a:brl(spent),b:brl(S.salary),p:Math.round(pct)})];
  return [L('a_warn_t',{p:S.warn}),L('a_warn_m',{a:brl(spent),b:brl(S.salary),p:S.limit,c:brl(S.salary*S.limit/100)})];
}
function checkAlerts(){
  if(!(S.salary>0))return;
  var spent=salSpent(CUR),pct=spent/S.salary*100,a=S.alerts[CUR]||(S.alerts[CUR]={});
  var hitL=pct>=S.limit,hitW=pct>=S.warn;
  if(hitL&&!a.limit){var c=alertCopy('bad',spent,pct);toast('bad',c[0],c[1]);sysNotify(c[0],c[1],'limit')}
  else if(hitW&&!hitL&&!a.warn){var d=alertCopy('warn',spent,pct);toast('warn',d[0],d[1]);sysNotify(d[0],d[1],'warn')}
  a.limit=hitL;a.warn=hitW;save();
}

function delExp(id){
  var gone=S.expenses.filter(function(x){return x.id===id})[0];
  S.expenses=S.expenses.filter(function(x){return x.id!==id});
  var back=editCtx;editId=null;editCtx=null;
  save();closeSheet();refresh();
  if(back){if(back.invest)openInvest();else openCat(back.month,back.cat,back.sub)}
  checkAlerts();toastUndo(L('del_t'),function(){if(gone){S.expenses.push(gone);save();refresh();checkAlerts()}});
}
document.addEventListener('submit',function(e){
  if(e.target.id!=='addForm')return;
  e.preventDefault();
  var name=$('#fName').value.trim(),price=+($('#fPrice').dataset.v||0),date=$('#fDate').value,time=$('#fTime').value||'12:00';
  var bad=!(price>0)?['fPrice','e_price']:!name?['fName','e_name']:!date?['fDate','e_date']:null;
  $$('#addForm .input').forEach(function(i){i.removeAttribute('aria-invalid')});
  if(bad){
    var bf=$('#'+bad[0]);bf.setAttribute('aria-invalid','true');
    $('#fErr').style.color='var(--bad)';$('#fErr').textContent=L(bad[1]);bf.focus();return;
  }
  var cur=editId?S.expenses.filter(function(x){return x.id===editId})[0]:null;
  var pay=$('#fPay').value||'pix';
  if(!cur){
    var rp=Math.round(price*100)/100,dup=S.expenses.some(function(x){return String(x.name||'').trim().toLowerCase()===name.toLowerCase()&&x.price===rp&&x.ts.slice(0,10)===date});
    if(dup&&!e.target.dataset.dupOk){e.target.dataset.dupOk='1';var fe=$('#fErr');fe.style.color='var(--warn)';fe.textContent=L('dup_warn');return}
  }
  if(cur){
    cur.cat=$('#fCat').value;cur.sub=$('#fSub').value;cur.pay=pay;cur.name=name;cur.price=Math.round(price*100)/100;cur.ts=date+'T'+time;
    var back=editCtx;editId=null;editCtx=null;
    save();closeSheet();refresh();checkAlerts();
    if(back){if(back.invest)openInvest();else openCat(back.month,back.cat,back.sub)}
    toast('info',L('upd_t'),name+' · '+brl(price));
    return;
  }
  S.lastPay=pay;
  var ni=+($('#fInst')&&$('#fInst').value)||1;
  if(ni>1){S.inst.push({id:'p'+Date.now().toString(36)+Math.floor(Math.random()*1e3),name:name,total:Math.round(price*100)/100,n:ni,cat:$('#fCat').value,sub:$('#fSub').value,pay:pay,day:+date.slice(8,10),time:time,start:date.slice(0,7),paid:0});genInst()}
  else S.expenses.push({id:'u'+Date.now().toString(36)+Math.floor(Math.random()*1e4),cat:$('#fCat').value,sub:$('#fSub').value,pay:pay,name:name,addr:'',price:Math.round(price*100)/100,ts:date+'T'+time});
  delete e.target.dataset.dupOk;
  askNotif();save();closeSheet();
  if(date.slice(0,7)<=CUR)VM=date.slice(0,7);
  refresh();
  if(date.slice(0,7)===CUR)checkAlerts();
  if(!$('#toast').classList.contains('show'))toast('info',L('saved_t'),name+' · '+brl(price));
});

  });

function syncFilterUI(){
  var sel={};S.fsubs.forEach(function(s){sel[s]=1});
  $$('#sheetBody input[data-fsub]').forEach(function(i){i.checked=!!sel[i.getAttribute('data-fsub')]});
  $$('#sheetBody input[data-fcat]').forEach(function(i){
    var c=CAT[i.getAttribute('data-fcat')],n=c.subs.filter(function(s){return sel[s]}).length;
    i.checked=n===c.subs.length;i.indeterminate=n>0&&n<c.subs.length;
  });
  var b=$('#fClear');if(b)b.disabled=!S.fsubs.length;
}
function setFilter(list){S.fsubs=list;save();renderHome();renderEx();syncFilterUI()}
function toggleSubs(ids,on){
  var set={};S.fsubs.forEach(function(s){set[s]=1});
  ids.forEach(function(s){if(on)set[s]=1;else delete set[s]});
  setFilter(Object.keys(set));
}
document.addEventListener('change',function(e){
  var el=e.target;if(!el.getAttribute)return;
  if(el.id==='fCat'){fillSubs();return}
  var fs=el.getAttribute('data-fsub'),fc=el.getAttribute('data-fcat');
  if(fs)toggleSubs([fs],el.checked);else if(fc)toggleSubs(CAT[fc].subs,el.checked);
});
document.addEventListener('input',function(e){

/* ---------- eventos ---------- */
var suppressClick=false;
var CLICKSEL='[data-drill],[data-undrill],[data-sub],[data-open-month],[data-perf],[data-pt],[data-edit],[data-close],[data-filter],[data-fclear],[data-fexp],[data-dopen],[data-dback],[data-dclose],[data-lang],[data-gact],[data-invest],[data-invadd],[data-bal],[data-addfirst],[data-mnav],[data-paychip],[data-formdel],[data-tmode],[data-gotab]';
document.addEventListener('click',function(e){
  if(suppressClick){suppressClick=false;e.preventDefault();e.stopPropagation();return}
  var t=e.target.closest(CLICKSEL);
  if(!t)return;
  var has=function(a){return t.hasAttribute(a)},get=function(a){return t.getAttribute(a)};
  if(has('data-dclose'))dClose();
  else if(has('data-dopen'))dShow(get('data-dopen'),'push');
  else if(has('data-dback'))dBack();
  else if(has('data-lang'))setLang(get('data-lang'));
  else if(has('data-tmode')){TM=get('data-tmode');try{localStorage.setItem(TMK,TM)}catch(x){}applyMode()}
  else if(has('data-gact'))gAct(get('data-gact'));
  else if(has('data-bal'))openBal(get('data-bal'));
  else if(has('data-addfirst'))openForm();
  else if(has('data-invest'))openInvest();
  else if(has('data-invadd'))openInvAdd();
  else if(has('data-close'))closeSheet();
  else if(has('data-filter'))openFilter();
  else if(has('data-fclear'))setFilter([]);
  else if(has('data-fexp')){var id=get('data-fexp');fExp[id]=!fExp[id];t.setAttribute('aria-expanded',fExp[id]?'true':'false');t.parentNode.nextElementSibling.hidden=!fExp[id]}
  else if(has('data-mnav')){var nk=shiftKey(VM,+get('data-mnav'));if(nk<=CUR&&nk>=minKey()){VM=nk;drill=null;renderHome();renderEx()}}
  else if(has('data-gotab'))go(1);
  else if(has('data-paychip'))setPay(get('data-paychip'));
  else if(has('data-formdel')){
    if(t.dataset.armed){delExp(editId)}
    else{t.dataset.armed='1';t.textContent=L('del_arm');setTimeout(function(){if(t.isConnected){delete t.dataset.armed;t.textContent=L('del')}},3500)}
  }
  else if(has('data-drill')){drill=get('data-drill');renderHome()}
  else if(has('data-undrill')){drill=null;renderHome()}
  else if(has('data-edit'))openForm(get('data-edit'));
  else if(has('data-perf')){perfMode=get('data-perf');renderHist()}
  else if(has('data-pt')){chPick(e.target.closest('[data-pt]'))}
  else if(has('data-open-month')){VM=get('data-open-month');drill=null;renderHome();renderEx();go(0);$('#pageHome').scrollTop=0}
  else if(has('data-sub'))openCat(get('data-month'),get('data-cat'),get('data-sub'));
},true);
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(!$('#sconf').hidden){var nb=$('#scNo');if(nb&&!nb.disabled)nb.click()}else if(!$('#sheet').hidden)closeSheet();else if(!$('#drawer').hidden)dClose()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('svg [data-drill]')){e.preventDefault();drill=e.target.getAttribute('data-drill');renderHome()}
});

/* abas e deslize */
var pager=$('#pager'),tabs=$$('.tab'),idx=0;
function setIdx(i){idx=i;tabs.forEach(function(t,j){t.setAttribute('aria-selected',j===i?'true':'false')})}
function go(i){i=Math.max(0,Math.min(3,i));pager.scrollTo({left:i*pager.clientWidth,behavior:'smooth'})}
pager.addEventListener('scroll',function(){var i=Math.round(pager.scrollLeft/pager.clientWidth);if(i!==idx)setIdx(i)},{passive:true});
tabs.forEach(function(t,i){t.addEventListener('click',function(){go(i)})});
var dragX=null;
pager.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse'||e.target.closest('input,select,textarea'))return;dragX=e.clientX});
window.addEventListener('pointerup',function(e){
  if(dragX===null)return;var dx=e.clientX-dragX;dragX=null;pager.classList.remove('dragging');
  if(Math.abs(dx)>70){suppressClick=true;setTimeout(function(){suppressClick=false},60);go(idx+(dx<0?1:-1))}
});
pager.addEventListener('pointermove',function(e){if(dragX!==null&&Math.abs(e.clientX-dragX)>8)pager.classList.add('dragging')});

/* ---------- aparência: claro / escuro / automático ---------- */
var TMK='cifrao-theme-v1',TM='dark';
try{TM=localStorage.getItem(TMK)||'dark'}catch(e){}
function applyMode(){
  var dark=TM==='dark'||(TM==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme',dark?'dark':'light');
  $('#themeColor').setAttribute('content',dark?'#07070B':'#F4F3F9');
  $$('[data-tmode]').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-tmode')===TM?'true':'false')});
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(TM==='auto')applyMode()})}catch(e){}

try{PRIV=localStorage.getItem(PVK)==='1'}catch(e){}

  document.documentElement.classList.toggle('priv',PRIV);
  var b=$('#privBtn');b.innerHTML=PRIV?ICON_EYEOFF:ICON_EYE;b.setAttribute('aria-pressed',PRIV?'true':'false');

var mLoaded=false,mStarted=false,mBlob=null,aud=null,audUrl=null;

function mtof(m){return 440*Math.pow(2,(m-69)/12)}
function tone(t,f,dur,type,peak,atk){
  var o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(peak,t+atk);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.05);

function genInit(){
  var Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return false;
  AC=new Ctx();master=AC.createGain();bus=AC.createGain();
  var dl=AC.createDelay(1),fb=AC.createGain(),wet=AC.createGain();
  dl.delayTime.value=.45;fb.gain.value=.4;wet.gain.value=.35;
  bus.connect(master);bus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(master);
  master.connect(AC.destination);return true;
}
function genTick(){
  while(genNext<AC.currentTime+1.5){
    var ch=CHORDS[Math.floor(genStep/16)%CHORDS.length],si=genStep%16,t=genNext;
    if(si===0){
      ch.forEach(function(n){tone(t,mtof(n),9.5,'triangle',.05,2.5);tone(t,mtof(n)*1.004,9.5,'sine',.04,2.5)});
      tone(t,mtof(ch[0]-12),8,'sine',.18,.8);
    }
    if(si%8!==7)tone(t,mtof(ch[ARP[si%8]]+12+(si%4===3?12:0)),1.8,'triangle',.05,.02);
    genStep++;genNext+=.5;
  }

  if(!AC&&!genInit())return;

}

var PBK_IT=310000; /* iterações do PBKDF2: deixa cada tentativa offline ~centenas de vezes mais lenta que um SHA-256 simples */

function instPer(p){return Math.round(p.total/p.n*100)/100}
function genInst(){
  var n=0,t=NOW.getDate();
  S.inst.forEach(function(p){
    var g=0;
    while(p.paid<p.n&&g++<60){
      var k=shiftKey(p.start,p.paid);if(k>CUR)break;
      var d=Math.min(p.day,daysIn(k));if(k===CUR&&d>t)break;
      var per=instPer(p),pr=p.paid===p.n-1?Math.round((p.total-per*(p.n-1))*100)/100:per;
      S.expenses.push({id:'q'+p.id+(p.paid+1),cat:p.cat,sub:p.sub,pay:p.pay,name:p.name+' ('+(p.paid+1)+'/'+p.n+')',addr:'',price:pr,ts:k+'-'+pad(d)+'T'+p.time,inst:p.id});
      p.paid++;n++;
    }
  });
  if(n)Repo.write(S);return n;
}

document.addEventListener('click',function(e){

  if(t.hasAttribute('data-recedit'))openRecForm(t.getAttribute('data-recedit'));
  else if(t.hasAttribute('data-instedit'))openInstForm(t.getAttribute('data-instedit'));
  else{
    var p=S.inst.filter(function(x){return x.id===t.getAttribute('data-instsave')})[0];if(!p)return;
    var nm=$('#pName').value.trim(),sb=$('#pSub').value,lock=p.paid>0,tot=Math.round(+($('#pTotal').dataset.v||0)*100)/100;
    if(!nm){$('#pErr').textContent=L('e_name');return}
    if(!lock&&!(tot>0)){$('#pErr').textContent=L('e_price');return}
    p.name=nm;p.cat=SUB[sb].cat;p.sub=sb;p.pay=$('#pPay').value;p.day=Math.max(1,Math.min(31,+$('#pDay').value||1));
    if(!lock){p.total=tot;p.n=+$('#pN').value}
    S.expenses.forEach(function(x){if(x.inst!==p.id)return;var m=/\((\d+)\/\d+\)$/.exec(x.name);x.name=nm+(m?' ('+m[1]+'/'+p.n+')':'');x.cat=p.cat;x.sub=p.sub;x.pay=p.pay});
    genInst();save();closeSheet();refresh();toast('info',L('inst_ok'),nm);
  }
});

/* ---------- armazenamento local (medidor) ---------- */
var LS_CAP=5*1024*1024;
function stStats(){var tot=0;try{tot=(localStorage.getItem(KEY)||'').length}catch(x){}return {tot:tot}}
function renderSt(){
  var b=$('#stBox');if(!b)return;var s=stStats(),pct=Math.min(100,s.tot/LS_CAP*100),st=pct>=90?'bad':pct>=70?'warn':'';
  b.innerHTML='<span class="track" role="img" aria-label="'+Math.round(pct)+'%"><i class="fill '+st+'" style="width:'+pct+'%"></i></span><p class="tx-meta" style="margin:6px 0 0">'+L('st_use',{mb:nf(s.tot/1048576,1)})+'</p>'+
   (pct>=70?'<p class="sub" role="alert" style="margin-top:8px;color:var(--warn)">'+L('st_warn')+'</p>':'');
}

/* ---------- confirmação forte (digitar a palavra ou o e-mail) ---------- */
function strongConfirm(o){
  var el=$('#sconf'),busyNow=false;
  el.innerHTML='<div class="scrim" data-scclose></div><div class="panel" role="alertdialog" aria-modal="true" aria-labelledby="scT" aria-describedby="scB" tabindex="-1"><div class="grab"></div>'+
    '<h3 class="sh-title" id="scT"></h3><p class="sub" id="scB" style="margin:10px 0 12px"></p><label class="sub" for="scIn" id="scL"></label>'+
    '<input class="input" id="scIn" autocomplete="off" autocapitalize="characters" spellcheck="false" style="margin-top:6px"><p class="g-msg" id="scM" role="status"></p>'+
    '<div class="btns" style="margin-top:14px"><button class="btn danger" type="button" id="scGo" disabled></button><button class="btn ghost" type="button" id="scNo"></button></div></div>';
  var q=function(i){return el.querySelector(i)},inp=q('#scIn'),go=q('#scGo'),no=q('#scNo'),msg=q('#scM');
  q('#scT').textContent=o.title;q('#scB').textContent=o.body;q('#scL').textContent=o.typeLbl;go.textContent=o.btn;no.textContent=o.cancel;
  function match(){var v=inp.value.trim().toLowerCase();return v!==''&&(v===String(o.word).toLowerCase()||(!!o.email&&v===String(o.email).toLowerCase()))}
  function close(){el.hidden=true;el.innerHTML=''}
  inp.addEventListener('input',function(){go.disabled=busyNow||!match()});
  no.addEventListener('click',function(){if(!busyNow)close()});
  q('[data-scclose]').addEventListener('click',function(){if(!busyNow)close()});
  go.addEventListener('click',async function(){
    if(busyNow||!match())return;
    busyNow=true;go.disabled=true;no.disabled=true;inp.disabled=true;msg.className='g-msg';msg.textContent='';
    try{await o.run(function(t){msg.textContent=t});close()}
    catch(e){busyNow=false;inp.disabled=false;no.disabled=false;go.disabled=!match();go.textContent=o.retry;msg.className='g-msg err';msg.textContent=(e&&e.message)||L('dev_err')}
  });
  el.hidden=false;inp.focus({preventScroll:true});
}
function wipeDevice(){
  var ks=[];try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(/^(cifrao-|ec-|sb-)/.test(k))ks.push(k)}}catch(e){}
  ks.forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});
  try{indexedDB.deleteDatabase('cifrao-music')}catch(e){}
  try{sessionStorage.clear()}catch(e){}
}
$('#devWipe').addEventListener('click',function(){
  strongConfirm({title:L('dev_t'),body:L('dev_body'),word:L('dev_word'),typeLbl:L('dev_type',{w:L('dev_word')}),btn:L('dev_go'),retry:L('dev_retry'),cancel:L('dev_cancel'),
    run:async function(){wipeDevice();setTimeout(function(){location.reload()},150)}});
});

/* ---------- ponte p/ sincronização na nuvem (supabase-sync.js lê/escreve o estado só por aqui) ---------- */
window.ECBridge={
  S:function(){return S},lang:function(){return lang},locale:function(){return LOC[lang]},glogo:function(){return GLOGO},
  hasUserData:function(){return userHasData()},
  isSeed:function(e){return !!S.sample&&/^s\d+$/.test(String(e&&e.id))},
  dropSeed:function(){S.expenses=S.expenses.filter(function(e){return !/^s\d+$/.test(String(e.id))});S.sample=false},
  persist:function(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}},
  normalize:function(){S=migrate(S)},
  applyPrefs:function(p){
    if(!p||typeof p!=='object')return;
    ['salary','va','limit','warn'].forEach(function(k){if(typeof p[k]==='number'&&isFinite(p[k]))S[k]=p[k]});
    if(p.budgets&&typeof p.budgets==='object')S.budgets=p.budgets;
  },
  afterMerge:function(prefs){if(prefs){setMoney($('#salary'),S.salary);setMoney($('#va'),S.va);renderHello()}refresh();checkAlerts()},
  refresh:function(){refresh()},renderSt:function(){renderSt()},renderAccount:function(){renderGoogle()},
  toast:function(k,t,m){toast(k,t,m)},strongConfirm:strongConfirm,
  reset:function(){ /* troca de conta: apaga dados locais da conta anterior (aparelho fica limpo) */
    S=migrate({expenses:[],salary:0,va:0,limit:70,warn:60,lang:lang});
    try{localStorage.removeItem(GK)}catch(e){}
    G={email:'',last:0};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    drill=null;VM=CUR;rollover();applyLang();
  }
};

/* ---------- início ---------- */
applyMode();
if(PN){$('#lock').hidden=false}
function boot(){
  /* privacidade: apaga fotos de perfil/fundo guardadas por versões anteriores */
  try{localStorage.removeItem('cifrao-avatar-v1');localStorage.removeItem('cifrao-bg-v1')}catch(e){}
  genRecurring();genInst();rollover();
  applyLang();setIdx(0);checkAlerts();
  gatesInit();
  gAuto();
  if(PH_PURGED>0){var pn=PH_PURGED;PH_PURGED=0;save();toast('info',L('ph_gone_t'),L('ph_gone_m',{n:pn}))}
}
/* data "viva": se o app ficou aberto/em segundo plano na virada do dia ou do mês, atualiza tudo */
function syncClock(){
  if(!booted)return;
  var n=new Date(),k=n.getFullYear()+'-'+pad(n.getMonth()+1);
  if(k===CUR&&n.getDate()===NOW.getDate())return;
  var monthChanged=k!==CUR,wasCur=VM===CUR;
  NOW=n;CUR=k;if(wasCur||VM>CUR)VM=CUR;
  genRecurring();genInst();rollover();
  if(monthChanged){drill=null;applyLang()}
  save();refresh();checkAlerts();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)syncClock()});
setInterval(syncClock,60000);
var booted=false;function bootOnce(){if(!booted){booted=true;boot()}}
try{Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,450)})]).then(bootOnce,bootOnce)}catch(e){bootOnce()}
})();
